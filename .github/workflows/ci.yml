name: IHC skill CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the frozen-core guard can read v2.3.0-rc3.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Frozen-core non-comment diff guard
        run: python tests/verify_frozen_core_diff.py
      - name: Static package validation
        run: python scripts/static_validate_package.py
      - name: External report consistency gate
        run: python scripts/verify_report_consistency.py
      - name: Summary generator determinism gate
        run: python tests/verify_summary_generator_determinism.py
      - name: Public-release privacy preflight
        run: python scripts/preflight_public_release.py
      - name: Verify release manifest
        run: python scripts/verify_package_manifest.py
      - name: Reject tracked local token blocklist
        run: test ! -e .private_tokens.txt

  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows dependencies are installed here. On Linux this directory may not
      # exist, in which case R continues to use its normal site libraries.
      R_LIBS_USER: ${{ github.workspace }}/Rlib
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        if: runner.os == 'Windows'
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Ensure R runtime on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y r-base r-base-dev
          fi
          Rscript --version

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config pandoc \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev \
            libfftw3-dev libuv1-dev libicu-dev

      - name: Install R dependencies on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: Rscript scripts/install_dependencies.R --lib=Rlib

      - name: Install R dependencies on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: Rscript scripts/install_dependencies.R --lib=Rlib

      - name: Verify R dependencies
        shell: Rscript {0}
        run: |
          local_lib <- file.path(Sys.getenv("GITHUB_WORKSPACE"), "Rlib")
          if (dir.exists(local_lib)) .libPaths(c(normalizePath(local_lib), .libPaths()))
          required <- c("EBImage", "data.table", "ggplot2", "ragg", "svglite")
          missing <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) stop("Missing R packages: ", paste(missing, collapse = ", "))
          cat("PASS: required R packages are available\n")
          cat("Library paths:\n", paste(.libPaths(), collapse = "\n"), "\n")

      - name: Verify HPA checkpoint resume regression
        shell: bash
        run: Rscript tests/verify_hpa_checkpoint_resume.R

      - name: Verify IF I/O bit-depth and projection contract
        shell: bash
        run: |
          Rscript -e 'repo_root <- normalizePath(getwd(), winslash = "/", mustWork = TRUE); local_lib <- file.path(repo_root, "Rlib"); if (dir.exists(local_lib)) .libPaths(c(normalizePath(local_lib), .libPaths())); source(file.path(repo_root, "scripts", "verify_if_io_bitdepth_contract.R"))'

      - name: Run synthetic smoke test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/run_synthetic_smoke_test.sh
      - name: Fail on tracked-artifact drift after smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --exit-code || { echo "::error::tracked release-evidence files drifted after regeneration; committed generated evidence is stale"; git diff --stat; exit 1; }

      - name: Run synthetic smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tests\run_synthetic_smoke_test.ps1
      - name: Fail on tracked-artifact drift after smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git diff --exit-code || { echo "::error::tracked release-evidence files drifted after regeneration; committed generated evidence is stale"; git diff --stat; exit 1; }

      - name: Upload synthetic QC and figures on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-output-${{ matrix.os }}
          path: tests/synthetic_output
          if-no-files-found: ignore

  if-io-validation:
    name: IF I/O validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlib
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        if: runner.os == 'Windows'
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Ensure R runtime on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y r-base r-base-dev
          fi
          Rscript --version

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config pandoc \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev \
            libfftw3-dev libuv1-dev libicu-dev

      - name: Install R dependencies
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: Rscript scripts/install_dependencies.R --lib=Rlib

      - name: Verify IF I/O and BBBC039 contracts
        shell: bash
        run: |
          Rscript -e 'repo_root <- normalizePath(getwd(), winslash = "/", mustWork = TRUE); local_lib <- file.path(repo_root, "Rlib"); if (dir.exists(local_lib)) .libPaths(c(normalizePath(local_lib), .libPaths())); source(file.path(repo_root, "scripts", "verify_if_io_bitdepth_contract.R")); source(file.path(repo_root, "tests", "verify_bbbc039_benchmark.R"))'
