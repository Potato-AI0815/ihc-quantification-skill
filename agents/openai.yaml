interface:
  display_name: "IHC & Immunofluorescence Quantification"
  short_description: "QC-first R/EBImage workflow for DAB-IHC and multi-channel immunofluorescence quantification."
  default_prompt: "Use $ihc-quantification to quantify chromogenic DAB/hematoxylin IHC and multi-channel immunofluorescence (IF) images. Preserve raw images, validate inputs, support reviewed include/exclude ROI annotations, quantify four measurement domains (global, nuclear, cytoplasmic, extracellular), compute linear MFI, colocalization (Pearson, Manders M1/M2), and puncta/foci detection, generate 8-panel diagnostic QC overviews, aggregate by biological_unit_id, and create biological comparison figures with fixed scales. Surface all low-n and QC limitations."
